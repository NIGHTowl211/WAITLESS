<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Waitless</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: night-clinic token board. Deep navy ground with violet glow, mono tokens on glowing cards, violet-to-blue gradient marks actions, amber marks "waiting / now serving". Dark-first; light via toggle. */
:root{
  --bg:#0A0A1C; --bg-2:#0E0E26; --surface:#12122E; --surface-2:#1A1A3C; --line:#26265A; --line-2:#34348A;
  --fg:#EDECFF; --muted:#9896C6;
  --accent:#7C5CFF; --accent-2:#4F8BFF; --accent-ink:#FFFFFF; --accent-soft:rgba(124,92,255,.16); --accent-text:#A58BFF;
  --ok:#3DDC97; --ok-soft:rgba(61,220,151,.14);
  --amber:#F5B843; --amber-bg:rgba(245,184,67,.14); --amber-ink:#F7C766;
  --danger:#FF6B81; --danger-soft:rgba(255,107,129,.14);
  --info:#7FA8FF; --info-soft:rgba(79,139,255,.16);
  --glow:rgba(124,92,255,.22); --glow-2:rgba(79,139,255,.14);
  --card:linear-gradient(160deg,#17173D 0%,#111130 100%);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 20px 40px -24px rgba(0,0,0,.8);
  --token-bg:linear-gradient(150deg,#1C1C4A 0%,#121236 100%); --token-fg:#FFFFFF;
  --display:"Outfit","Segoe UI",system-ui,sans-serif;
  --body:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F4F3FF; --bg-2:#ECEAFE; --surface:#FFFFFF; --surface-2:#EFEDFC; --line:#DDD9F6; --line-2:#C7C0F3;
  --fg:#15133A; --muted:#625F8E;
  --accent:#6A4BF5; --accent-2:#3D74F0; --accent-ink:#FFFFFF; --accent-soft:#E7E1FF; --accent-text:#5A3CE6;
  --ok:#11905C; --ok-soft:#DDF5EA;
  --amber:#B97D06; --amber-bg:#FCEFD0; --amber-ink:#7A5200;
  --danger:#CC3D4E; --danger-soft:#FBE1E4;
  --info:#3D6FE0; --info-soft:#E1EAFD;
  --glow:rgba(124,92,255,.14); --glow-2:rgba(79,139,255,.10);
  --card:linear-gradient(160deg,#FFFFFF 0%,#FAF9FF 100%);
  --shadow:0 1px 2px rgba(21,19,58,.05),0 18px 36px -24px rgba(60,40,160,.35);
  --token-bg:linear-gradient(150deg,#1C1C4A 0%,#121236 100%); --token-fg:#FFFFFF;
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;transition:background .15s,border-color .15s,transform .05s;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-primary:hover{filter:brightness(1.07);border-color:var(--accent)}
.btn-danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn-danger:hover{background:var(--danger-soft);border-color:var(--danger)}
.btn-sm{padding:5px 10px;font-size:13px;border-radius:7px}
.btn-icon{width:30px;height:30px;padding:0;border-radius:7px;font-size:14px}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--surface-2);border-color:transparent}

/* form */
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600}
.input,.select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.input:focus,.select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.err{color:var(--danger);font-size:13px;min-height:18px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-waiting{background:var(--info-soft);color:var(--info)}
.st-in{background:var(--amber-bg);color:var(--amber-ink)}
.st-done{background:var(--accent-soft);color:var(--accent)}
.st-noshow,.st-cancelled{background:var(--danger-soft);color:var(--danger)}
.st-break{background:var(--surface-2);color:var(--muted)}
.prio{background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:1px 6px;border-radius:4px;text-transform:uppercase}

/* topbar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--surface)}
.topbar-in{display:flex;align-items:center;gap:12px;height:60px;max-width:1320px;margin:0 auto}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:700}
.role-tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.spacer{flex:1}
.today{font-size:13px;color:var(--muted)}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-brand{background:var(--surface-2);padding-block:48px;display:flex;flex-direction:column;justify-content:center;gap:28px;border-right:1px solid var(--line)}
.login-brand-in{max-width:520px;margin:0 auto;width:100%;display:grid;gap:26px}
.login-brand h1{font-size:clamp(34px,4.4vw,54px);line-height:1.02;font-weight:800}
.login-brand h1 em{font-style:normal;color:var(--accent)}
.login-brand p{margin:0;color:var(--muted);max-width:44ch;font-size:16px}
.board{background:#0E1715;color:#DDE8E4;border-radius:14px;padding:18px;display:grid;gap:10px;box-shadow:var(--shadow);max-width:440px}
.board-head{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:#7F9590}
.board-row{display:grid;grid-template-columns:80px 1fr auto;gap:12px;align-items:center;font-family:var(--mono);font-size:14px;padding:8px 10px;border-radius:8px;background:#16221F}
.board-row b{font-size:20px;color:#F0B545}
.board-row span:last-child{color:#7F9590;font-size:12px}
.board-row.now{background:#2B220E}
.login-side{display:flex;align-items:center;justify-content:center;padding-block:40px}
.login-card{width:100%;max-width:400px;display:grid;gap:20px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:10px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:9px;border-radius:7px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.login-form{display:grid;gap:14px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer}
.demo{border:1px dashed var(--line);border-radius:10px;padding:14px;display:grid;gap:10px}
.demo-btns{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted)}

/* ---------- shared layout ---------- */
.page{max-width:1320px;margin:0 auto;padding-block:24px 48px;display:grid;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card-h h2,.card-h h3{font-size:17px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{padding:14px 16px;display:grid;gap:2px}
.stat .v{font-family:var(--display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .v small{font-size:15px;color:var(--muted);font-weight:500}

/* admin */
.admin-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .input,.toolbar .select{width:auto;flex:1 1 170px;padding:8px 12px}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.doc{display:flex;flex-direction:column;min-width:0}
.doc-h{padding:14px 16px 12px;display:grid;gap:3px;border-bottom:1px solid var(--line)}
.doc-h .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.doc-h h3{font-size:17px}
.doc-meta{font-size:13px;color:var(--muted)}
.avail{border:0;cursor:pointer}
.now{margin:12px 16px 0;padding:10px 12px;border-radius:9px;background:var(--amber-bg);color:var(--amber-ink);display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.now .tok{font-family:var(--mono);font-weight:700;font-size:20px}
.now .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now .lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;opacity:.75}
.now-actions{display:flex;gap:4px}
.now-actions .btn{background:transparent;border-color:color-mix(in srgb,var(--amber-ink) 30%,transparent);color:var(--amber-ink)}
.now.empty{background:var(--surface-2);color:var(--muted);grid-template-columns:1fr;font-size:13.5px}
.callnext{margin:10px 16px 4px}
.callnext .btn{width:100%}
.q{list-style:none;margin:0;padding:6px 8px 10px;display:grid;gap:2px}
.qrow{display:grid;grid-template-columns:18px 62px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;border:1px solid transparent;background:var(--surface)}
.qrow:hover{background:var(--surface-2)}
.qrow.dragging{opacity:.4}
.qrow.drop-before{box-shadow:inset 0 2px 0 var(--accent)}
.qrow.drop-after{box-shadow:inset 0 -2px 0 var(--accent)}
.qrow.match{border-color:var(--accent)}
.handle{cursor:grab;color:var(--muted);font-size:14px;user-select:none;text-align:center}
.qtok{font-family:var(--mono);font-weight:700;font-size:14px}
.qname{min-width:0}
.qname b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qname span{font-size:12.5px;color:var(--muted)}
.qact{display:flex;gap:2px}
.qact .btn-icon{width:28px;height:28px;font-size:13px}
.qact .on{color:var(--danger)}
.q-empty{padding:16px;text-align:center;color:var(--muted);font-size:13.5px}

/* inbox */
.inbox{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;max-height:calc(100vh - 100px);min-height:420px}
.threads{list-style:none;margin:0;padding:6px;display:grid;gap:2px;max-height:200px;overflow:auto;border-bottom:1px solid var(--line)}
.thread{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:8px;cursor:pointer;border:0;background:transparent;text-align:left;width:100%}
.thread:hover{background:var(--surface-2)}
.thread[aria-current="true"]{background:var(--accent-soft)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--accent);border:1px solid var(--line)}
.thread .t-name{font-weight:600;font-size:14px}
.thread .t-last{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--danger);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:180px}
.msg{max-width:82%;padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.msg time{display:block;font-size:11px;opacity:.65;margin-top:2px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.msgs-empty{margin:auto;text-align:center;color:var(--muted);font-size:13.5px;max-width:30ch}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.composer .input{padding:9px 12px}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 12px}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer}
.quick button:hover{border-color:var(--accent);color:var(--accent)}

/* patient */
.patient-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.ticket{overflow:hidden}
.ticket-top{display:grid;grid-template-columns:auto 1fr;gap:24px;padding:24px;align-items:center}
.tokbox{background:#0E1715;color:#F0B545;border-radius:12px;padding:16px 22px;text-align:center;min-width:170px}
.tokbox .label{color:#7F9590}
.tokbox .big{font-family:var(--mono);font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-.02em}
.ticket-info{display:grid;gap:6px;min-width:0}
.ticket-info h2{font-size:24px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fact{padding:16px 24px;display:grid;gap:2px}
.fact+.fact{border-left:1px solid var(--line)}
.fact .v{font-family:var(--display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.fact .v.mono{font-family:var(--mono);font-size:24px}
.progress{padding:18px 24px 6px;display:grid;gap:8px}
.bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .6s ease}
.bar-legend{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.alert{margin:14px 24px 0;padding:12px 14px;border-radius:10px;display:flex;gap:10px;align-items:center;font-weight:600}
.alert.next{background:var(--amber-bg);color:var(--amber-ink);animation:pulse 1.6s ease-in-out infinite}
.alert.turn{background:var(--accent);color:var(--accent-ink)}
.alert.warn{background:var(--surface-2);color:var(--muted);font-weight:500}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--amber) 25%,transparent)}}
.ticket-actions{display:flex;gap:10px;padding:18px 24px 22px;flex-wrap:wrap}
.book{padding:22px;display:grid;gap:16px}
.book-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 10px;font-family:var(--mono);font-size:13px;cursor:pointer}
.slot:hover{border-color:var(--accent)}
.slot[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.preview{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:9px;background:var(--surface-2);font-size:14px;flex-wrap:wrap}
.hist{list-style:none;margin:0;padding:6px 16px 14px}
.hist li{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.hist li:last-child{border-bottom:0}
.chatcard{display:flex;flex-direction:column;height:560px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}

/* modal + toast */
.modal-back{position:fixed;inset:0;background:rgba(8,14,13,.5);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .15s}
.modal{width:100%;max-width:460px;background:var(--surface);border-radius:14px;border:1px solid var(--line);box-shadow:0 20px 50px -20px rgba(0,0,0,.5);display:grid;gap:16px;padding:22px;max-height:calc(100vh - 32px);overflow:auto}
.modal h3{font-size:20px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px}
@keyframes fade{from{opacity:0}}
.toasts{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:60;max-width:min(360px,calc(100vw - 32px))}
.toast{background:var(--fg);color:var(--bg);padding:11px 14px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:var(--shadow);animation:fade .2s}


/* ---- beauty layer ---- */
body{background:
  radial-gradient(900px 500px at 15% -10%,var(--glow),transparent 60%),
  radial-gradient(700px 500px at 100% 10%,var(--glow-2),transparent 60%),
  var(--bg);background-attachment:fixed}
.card{background:var(--card);border-color:var(--line);box-shadow:var(--shadow);border-radius:16px}
.btn{border-radius:10px;background:var(--surface)}
.btn-primary{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--accent-2)));border-color:transparent;color:var(--accent-ink);box-shadow:0 8px 24px -10px var(--accent)}
.btn-primary:hover{filter:brightness(1.1);border-color:transparent}
.btn-ghost{background:transparent}
.input,.select{background:var(--bg-2);border-color:var(--line);border-radius:10px}
.input:focus,.select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.brand-mark{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 6px 18px -6px var(--accent)}
.topbar{background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
body::before{background:var(--bg)}
.role-tag{background:var(--accent-soft);color:var(--accent-text)}
.st-done{background:var(--ok-soft);color:var(--ok)}
.st-in{background:var(--amber-bg);color:var(--amber-ink)}
.seg{background:var(--bg-2);border:1px solid var(--line);border-radius:12px}
.seg button[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--accent-2)));color:#fff}
.linkbtn{color:var(--accent-text)}
.check input{accent-color:var(--accent)}
.demo{border-color:var(--line-2);background:var(--accent-soft)}

/* login hero */
.login-brand{background:transparent;border-right:0}
.pill{display:inline-flex;align-items:center;gap:7px;width:max-content;max-width:100%;padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--accent-text);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.login-brand h1{font-size:clamp(36px,4.6vw,58px);line-height:1.04;font-weight:800;letter-spacing:-.025em}
.grad{background:linear-gradient(90deg,#A58BFF,#7C5CFF 45%,#4F8BFF);-webkit-background-clip:text;background-clip:text;color:transparent}
.tcard{position:relative;max-width:400px;padding:22px 24px;border-radius:18px;background:var(--token-bg);color:var(--token-fg);border:1px solid #34348A;
  box-shadow:0 0 0 1px rgba(124,92,255,.15),0 30px 60px -20px rgba(124,92,255,.55),0 0 80px -20px rgba(79,139,255,.45);animation:float 6s ease-in-out infinite}
.tcard .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}

<body>
<div id="app"></div>
<div id="modal-root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
/* ================= storage ================= */
const KEY = 'waitless:v1', SESSION = 'waitless:session', THEME = 'waitless:theme';
const AVG = 10; // minutes per consultation
const mem = {};
const ls = {
  get(k){ try{ const v = localStorage.getItem(k); return v ?? mem[k] ?? null }catch(e){ return mem[k] ?? null } },
  set(k,v){ mem[k]=v; try{ localStorage.setItem(k,v) }catch(e){} },
  del(k){ delete mem[k]; try{ localStorage.removeItem(k) }catch(e){} }
};

const DEPTS = [
  {id:'GM', name:'General Medicine', L:'G'},
  {id:'PD', name:'Pediatrics', L:'P'},
  {id:'OR', name:'Orthopedics', L:'O'},
  {id:'CA', name:'Cardiology', L:'C'},
  {id:'DE', name:'Dermatology', L:'D'}
];
const deptOf = id => DEPTS.find(d => d.id === id);
const todayStr = () => new Date().toISOString().slice(0,10);

function seed(){
  const doctors = [
    {id:'d1', name:'Dr. Ananya Rao',   dept:'GM', from:'09:00', to:'13:00', room:'101', available:true},
    {id:'d2', name:'Dr. Vikram Sethi', dept:'GM', from:'13:00', to:'17:00', room:'102', available:true},
    {id:'d3', name:'Dr. Meera Iyer',   dept:'PD', from:'10:00', to:'14:00', room:'201', available:true},
    {id:'d4', name:'Dr. Arjun Mehta',  dept:'OR', from:'11:00', to:'16:00', room:'204', available:false},
    {id:'d5', name:'Dr. Farah Khan',   dept:'CA', from:'09:30', to:'12:30', room:'301', available:true},
    {id:'d6', name:'Dr. Rohan Das',    dept:'DE', from:'14:00', to:'18:00', room:'305', available:true}
  ];
  const raw = [
    ['Manoj Tiwari','d1','09:00','done'],
    ['Rahul Verma','d1','09:00','in'],
    ['Sneha Kapoor','d1','09:30','waiting'],
    ['Amit Joshi','d1','09:30','waiting'],
    ['Priya Sharma','d1','10:00','waiting','priya'],
    ['Kavya Nair','d1','10:30','waiting'],
    ['Imran Sheikh','d2','13:00','waiting'],
    ['Aarav Gupta','d3','10:00','in'],
    ['Ishaan Malhotra','d3','10:30','waiting'],
    ['Suresh Pillai','d4','11:00','waiting'],
    ['Gurpreet Singh','d4','11:30','waiting'],
    ['Lakshmi Menon','d5','09:30','in'],
    ['Deepak Yadav','d5','10:00','waiting',null,true],
    ['Anjali Bose','d5','10:00','waiting'],
    ['Pooja Reddy','d5','09:30','cancelled'],
    ['Ritu Agarwal','d6','14:00','waiting']
  ];
  const counters = {};
  const bookings = raw.map((r,i) => {
    const doc = doctors.find(d => d.id === r[1]);
    const L = deptOf(doc.dept).L;
    counters[L] = (counters[L] || 10) + 1;
    return {id:'b'+(i+1), token:`${L}-${counters[L]}`, name:r[0], doc:r[1], dept:doc.dept, slot:r[2],
            status:r[3], user:r[4]||null, priority:!!r[5], order:i, date:todayStr(), startAhead:3, created:Date.now()};
  });
  bookings.push({id:'bh1', token:'P-07', name:'Priya Sharma', doc:'d3', dept:'PD', slot:'11:00', status:'done', user:'priya', priority:false, order:-1, date:'2026-09-14', startAhead:2, created:0});
  bookings.push({id:'bh2', token:'G-22', name:'Priya Sharma', doc:'d2', dept:'GM', slot:'15:30', status:'cancelled', user:'priya', priority:false, order:-2, date:'2026-08-03', startAhead:4, created:0});
  return {
    doctors, bookings, counters, seq:100,
    users:{ priya:{pass:'1234', name:'Priya Sharma'} },
    chats:{
      priya:[
        {from:'user', text:'Hi, is Dr. Rao running on time today?', t:Date.now()-14*60000, read:false},
      ],
      kavya:[
        {from:'user', text:'Can I bring my old X-ray reports?', t:Date.now()-40*60000, read:true},
        {from:'admin', text:'Yes, please bring them to the counter.', t:Date.now()-38*60000, read:true}
      ]
    },
    chatNames:{ priya:'Priya Sharma', kavya:'Kavya Nair' }
  };
}

let S;
function load(){
  try{ S = JSON.parse(ls.get(KEY)) }catch(e){ S = null }
  if(!S || !S.doctors){ S = seed(); save() }
}
function save(){ ls.set(KEY, JSON.stringify(S)) }
function commit(){ save(); refresh() }

/* ================= helpers ================= */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = n => n.split(/\s+/).map(w => w[0]).slice(0,2).join('').toUpperCase();
const docById = id => S.doctors.find(d => d.id === id);
const fmtTime = t => new Date(t).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
const STATUS = {waiting:'Waiting', in:'In consultation', done:'Done', noshow:'No-show', cancelled:'Cancelled'};
const chip = s => `<span class="chip st-${s}">${STATUS[s]}</span>`;

function queueOf(docId){
  return S.bookings.filter(b => b.doc === docId && b.status === 'waiting' && b.date === todayStr())
                   .sort((a,b) => a.order - b.order);
}
function inConsult(docId){ return S.bookings.find(b => b.doc === docId && b.status === 'in' && b.date === todayStr()) }
function aheadOf(b){
  const q = queueOf(b.doc); const i = q.findIndex(x => x.id === b.id);
  return i < 0 ? 0 : i;
}
function waitMin(b){
  const cur = inConsult(b.doc);
  return aheadOf(b) * AVG + (cur ? Math.round(AVG/2) : 0);
}
function slotsFor(doc){
  const out = []; let [h,m] = doc.from.split(':').map(Number); const [eh,em] = doc.to.split(':').map(Number);
  while(h*60+m < eh*60+em){ out.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`); m += 30; if(m>=60){h++;m-=60} }
  return out;
}
function nextToken(dept){
  const L = deptOf(dept).L; S.counters[L] = (S.counters[L] || 10) + 1; return `${L}-${S.counters[L]}`;
}
function maxOrder(){ return S.bookings.reduce((m,b) => Math.max(m,b.order), 0) }
function createBooking({name, dept, doc, slot, user=null, priority=false}){
  const q = queueOf(doc);
  const b = {id:'b'+(++S.seq), token:nextToken(dept), name, doc, dept, slot, status:'waiting', user, priority,
             order: priority ? (q.length ? q[0].order - 1 : maxOrder()+1) : maxOrder()+1,
             date:todayStr(), startAhead: priority ? 0 : q.length, created:Date.now()};
  S.bookings.push(b); return b;
}

/* toast / modal / sound */
function toast(msg){
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), 3200);
}
function closeModal(){ $('#modal-root').innerHTML = '' }
function openModal(html, mount){
  $('#modal-root').innerHTML = `<div class="modal-back" id="mb"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  $('#mb').addEventListener('click', e => { if(e.target.id === 'mb') closeModal() });
  mount && mount($('#modal-root .modal'));
  const f = $('#modal-root input, #modal-root select, #modal-root button'); f && f.focus();
}
function confirmBox(title, text, okLabel, fn, danger=true){
  openModal(`<h3>${esc(title)}</h3><p class="muted" style="margin:0">${esc(text)}</p>
    <div class="modal-actions"><button class="btn" data-x>Keep it</button><button class="btn ${danger?'btn-danger':'btn-primary'}" data-ok>${esc(okLabel)}</button></div>`,
    m => { $('[data-x]',m).onclick = closeModal; $('[data-ok]',m).onclick = () => { closeModal(); fn() } });
}
let actx;
function beep(){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    [0, .22].forEach(d => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(.0001, actx.currentTime+d); g.gain.exponentialRampToValueAtTime(.2, actx.currentTime+d+.02);
      g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime+d+.18);
      o.start(actx.currentTime+d); o.stop(actx.currentTime+d+.2);
    });
  }catch(e){}
}

/* theme */
function applyTheme(t){ if(t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme') }
function isDark(){
  const t = document.documentElement.getAttribute('data-theme');
  return t !== 'light';
}
function toggleTheme(){ const t = isDark() ? 'light' : 'dark'; applyTheme(t); ls.set(THEME, t); $('#themeBtn') && ($('#themeBtn').textContent = isDark() ? '☀' : '☾') }
applyTheme(ls.get(THEME));

/* ================= session ================= */
let session = null;
function startSession(s, remember){
  session = s; if(remember) ls.set(SESSION, JSON.stringify(s)); else ls.del(SESSION);
  render();
}
function logout(){ session = null; ls.del(SESSION); render() }

function render(){
  closeModal();
  if(!session) return renderLogin();
  if(session.role === 'admin') return renderAdmin();
  renderPatient();
}
function refresh(){
  if(!session) return;
  if(session.role === 'admin'){ renderStats(); renderBoard(); renderThreads(); renderThread() }
  else { renderPatientMain(); renderHistory(); renderPChat() }
}
function topbar(roleLabel, who){
  return `<header class="topbar wrap"><div class="topbar-in">
    <div class="brand"><span class="brand-mark">W</span>Waitless</div>
    <span class="role-tag">${esc(roleLabel)}</span><div class="spacer"></div>
    <span class="today">${new Date().toLocaleDateString([], {weekday:'long', day:'numeric', month:'short'})}</span>
    <span style="font-weight:600;font-size:14px">${esc(who)}</span>
    <button class="btn btn-ghost btn-icon" id="themeBtn" title="Switch light/dark">${isDark() ? '☀' : '☾'}</button>
    <button class="btn btn-sm" id="logoutBtn">Log out</button>
  </div></header>`;
}
function bindTop(){ $('#themeBtn').onclick = toggleTheme; $('#logoutBtn').onclick = logout }

/* ================= LOGIN ================= */
let loginRole = 'patient', loginMode = 'signin';
function renderLogin(){
  const q = queueOf('d1'), cur = inConsult('d1');
  $('#app').innerHTML = `
  <main class="login">
    <section class="login-brand wrap"><div class="login-brand-in">
      <div class="brand"><span class="brand-mark">W</span>Waitless</div>
      <span class="pill">No more guessing your place in line</span>
      <h1>Book ahead.<br>Watch your token move.<br><span class="grad">Skip the wait.</span></h1>
      <p>Take a token for any department, track the live queue from your phone, and walk in only when it's your turn.</p>
      ${(() => { const b = q[Math.min(2, q.length-1)]; return b ? `
      <div class="tcard" aria-hidden="true">
        <div class="row"><div><div class="k">${deptOf(b.dept).name} · Room ${docById(b.doc).room}</div><div class="tk">${b.token}</div></div><span class="wchip">Waiting</span></div>
        <hr>
        <div class="row"><div><div class="k">Position</div><div class="v">#${aheadOf(b)+1}</div></div>
        <div><div class="k">Now serving</div><div class="v live">${cur ? cur.token : '—'}</div></div>
        <div style="text-align:right"><div class="k">Estimated wait</div><div class="v live">~${waitMin(b)} min</div></div></div>
      </div>` : '' })()}
      <div class="mini-q">${DEPTS.map(d => `<span>${d.L} · ${d.name}</span>`).join('')}</div>
    </div></section>
    <section class="login-side wrap"><div class="login-card">
      <div><h2 style="font-size:26px">${loginMode === 'signup' ? 'Create your account' : 'Sign in'}</h2>
      <p class="muted" style="margin:4px 0 0">${loginRole === 'admin' ? 'Front desk and clinic staff' : 'Patients and visitors'}</p></div>
      <div class="seg" role="group" aria-label="Sign in as">
        <button type="button" data-role="patient" aria-pressed="${loginRole==='patient'}">Patient</button>
        <button type="button" data-role="admin" aria-pressed="${loginRole==='admin'}">Admin</button>
      </div>
      <form class="login-form" id="loginForm" novalidate>
        ${loginMode === 'signup' ? `<div class="field"><label for="fullname">Full name</label><input class="input" id="fullname" autocomplete="name" placeholder="e.g. Rohit Kumar"></div>` : ''}
        <div class="field"><label for="uname">Username</label><input class="input" id="uname" autocomplete="username" placeholder="${loginRole==='admin'?'admin':'your username'}"></div>
        <div class="field"><label for="pass">Password</label><input class="input" id="pass" type="password" autocomplete="current-password" placeholder="••••••"></div>
        <div class="row-between">
          <label class="check"><input type="checkbox" id="remember" checked> Remember me</label>
          ${loginRole === 'patient' ? `<button type="button" class="linkbtn" id="modeBtn">${loginMode==='signup' ? 'I have an account' : 'Create account'}</button>` : ''}
        </div>
        <div class="err" id="loginErr"></div>
        <button class="btn btn-primary" type="submit" style="padding:12px">${loginMode==='signup' ? 'Create account' : 'Sign in'}</button>
      </form>
      <div class="demo">
        <span class="label">Demo accounts</span>
        <div class="demo-btns">
          <button class="btn btn-sm" id="demoAdmin">Admin · admin / admin123</button>
          <button class="btn btn-sm" id="demoPatient">Patient · priya / 1234</button>
        </div>
        <span class="hint">Tip: open the page in two tabs, admin in one and patient in the other. Changes show up live.</span>
      </div>
    </div></section>
  </main>`;
  document.querySelectorAll('[data-role]').forEach(b => b.onclick = () => { loginRole = b.dataset.role; if(loginRole==='admin') loginMode='signin'; renderLogin() });
  $('#modeBtn') && ($('#modeBtn').onclick = () => { loginMode = loginMode === 'signup' ? 'signin' : 'signup'; renderLogin() });
  $('#demoAdmin').onclick = () => startSession({role:'admin', user:'admin', name:'Front Desk'}, $('#remember').checked);
  $('#demoPatient').onclick = () => startSession({role:'patient', user:'priya', name:'Priya Sharma'}, $('#remember').checked);
  $('#loginForm').onsubmit = e => {
    e.preventDefault();
    const u = $('#uname').value.trim().toLowerCase(), p = $('#pass').value, err = $('#loginErr'), rem = $('#remember').checked;
    if(!u || !p) return err.textContent = 'Enter your username and password.';
    if(loginRole === 'admin'){
      if(u === 'admin' && p === 'admin123') return startSession({role:'admin', user:'admin', name:'Front Desk'}, rem);
      return err.textContent = 'Wrong admin username or password. Try admin / admin123.';
    }
    if(loginMode === 'signup'){
      const name = $('#fullname').value.trim();
      if(!name) return err.textContent = 'Enter your full name.';
      if(!/^[a-z0-9_]{3,}$/.test(u)) return err.textContent = 'Username needs 3+ letters, numbers or _.';
      if(p.length < 4) return err.textContent = 'Password needs at least 4 characters.';
      if(S.users[u] || u === 'admin') return err.textContent = 'That username is taken.';
      S.users[u] = {pass:p, name}; save();
      return startSession({role:'patient', user:u, name}, rem);
    }
    const acc = S.users[u];
    if(!acc || acc.pass !== p) return err.textContent = 'Wrong username or password.';
    startSession({role:'patient', user:u, name:acc.name}, rem);
  };
}

/* ================= ADMIN ================= */
let fDept = 'all', fSearch = '', activeThread = null, lastUnread = -1;
function renderAdmin(){
  $('#app').innerHTML = topbar('Admin', 'Front Desk') + `
  <main class="page wrap">
    <section class="stats" id="stats"></section>
    <div class="admin-grid">
      <section style="display:grid;gap:14px;min-width:0">

          <select class="select" id="deptFilter"><option value="all">All departments</option>${DEPTS.map(d => `<option value="${d.id}" ${fDept===d.id?'selected':''}>${d.name}</option>`).join('')}</select>
        </div>

      </aside>

  </main>`;
  bindTop();
  $('#search').oninput = e => { fSearch = e.target.value.trim().toLowerCase(); renderBoard() };

  $('#addBtn').onclick = () => bookingModal({admin:true});
  $('#resetBtn').onclick = () => confirmBox('Reset demo data?', 'All bookings, chats and new accounts go back to the sample data.', 'Reset', () => { S = seed(); activeThread = null; commit(); toast('Demo data reset') });
  $('#aform').onsubmit = e => {
    e.preventDefault(); const v = $('#ainput').value.trim(); if(!v || !activeThread) return;
    S.chats[activeThread].push({from:'admin', text:v, t:Date.now(), read:false}); $('#ainput').value=''; commit();
  };
  lastUnread = -1;
  refresh();
}
function renderStats(){
  const today = S.bookings.filter(b => b.date === todayStr());
  const active = today.filter(b => b.status !== 'cancelled');
  const waiting = today.filter(b => b.status === 'waiting');
  const avg = waiting.length ? Math.round(waiting.reduce((s,b) => s + waitMin(b), 0) / waiting.length) : 0;
  const canc = today.filter(b => b.status === 'cancelled' || b.status === 'noshow').length;
  const onBreak = S.doctors.filter(d => !d.available).length;
  $('#stats').innerHTML = [
    ['Bookings today', active.length, ''],
    ['Waiting now', waiting.length, `${S.doctors.length - onBreak} doctors in`],
    ['Average wait', avg, 'min'],
    ['Cancelled / no-show', canc, '']
  ].map(([l,v,s]) => `<div class="card stat"><span class="label">${l}</span><span class="v">${v} <small>${s}</small></span></div>`).join('');
}
function renderBoard(){
  const docs = S.doctors.filter(d => fDept === 'all' || d.dept === fDept);
  $('#board').innerHTML = docs.map(d => {
    const q = queueOf(d.id), cur = inConsult(d.id);
    const match = b => fSearch && (b.name.toLowerCase().includes(fSearch) || b.token.toLowerCase().includes(fSearch));
    const shown = fSearch ? q.filter(match) : q;
    return `<article class="card doc">
      <div class="doc-h">
        <div class="top"><h3>${esc(d.name)}</h3>
          <button class="avail chip ${d.available ? 'st-done' : 'st-break'}" data-avail="${d.id}" title="Toggle availability">${d.available ? 'Available' : 'On break'}</button></div>
        <span class="doc-meta">${deptOf(d.dept).name} · Room ${d.room} · <span class="mono">${d.from}–${d.to}</span> · ${q.length} waiting</span>
      </div>
      ${cur ? `<div class="now"><span class="tok">${cur.token}</span><div style="min-width:0"><div class="lbl">Now serving</div><div class="nm">${esc(cur.name)}</div></div>
          <div class="now-actions"><button class="btn btn-sm" data-done="${cur.id}" title="Mark done">✓ Done</button><button class="btn btn-sm" data-noshow="${cur.id}" title="Mark no-show">No-show</button></div></div>`
        : `<div class="now empty">No one in consultation</div>`}
      <div class="callnext"><button class="btn btn-primary" data-next="${d.id}" ${q.length && d.available ? '' : 'disabled'}>${d.available ? (q.length ? `Call next · ${q[0].token}` : 'Queue is empty') : 'Doctor on break'}</button></div>
      <ul class="q" data-doc="${d.id}">
        ${shown.length ? shown.map((b,i) => `
          <li class="qrow ${match(b)?'match':''}" draggable="${fSearch?'false':'true'}" data-id="${b.id}">
            <span class="handle" aria-hidden="true">⠿</span>
            <span class="qtok">${b.token}</span>
            <span class="qname"><b>${esc(b.name)} ${b.priority ? '<span class="prio">Urgent</span>' : ''}</b><span><span class="mono">${b.slot}</span> · ~${waitMin(b)} min${b.user ? ' · app' : ' · walk-in'}</span></span>
            <span class="qact">
              <button class="btn btn-ghost btn-icon" data-up="${b.id}" title="Move up" ${q[0].id===b.id?'disabled':''}>↑</button>
              <button class="btn btn-ghost btn-icon" data-down="${b.id}" title="Move down" ${q[q.length-1].id===b.id?'disabled':''}>↓</button>
              <button class="btn btn-ghost btn-icon ${b.priority?'on':''}" data-prio="${b.id}" title="${b.priority?'Remove urgent flag':'Mark urgent'}">⚑</button>
              <button class="btn btn-ghost btn-icon" data-cancel="${b.id}" title="Cancel booking" style="color:var(--danger)">✕</button>
            </span>
          </li>`).join('') : `<li class="q-empty">${fSearch ? 'No match in this queue' : 'Nobody waiting'}</li>`}
      </ul>
    </article>`;
  }).join('') || `<p class="muted">No doctors in this department.</p>`;
  bindBoard();
}
function reorder(docId, ids){
  const base = Math.min(...queueOf(docId).map(b => b.order));
  ids.forEach((id,i) => { S.bookings.find(b => b.id === id).order = base + i });
}
function bindBoard(){
  const B = $('#board');
  B.onclick = e => {
    const t = e.target.closest('button'); if(!t) return; const ds = t.dataset;
    const find = id => S.bookings.find(b => b.id === id);
    if(ds.avail){ const d = docById(ds.avail); d.available = !d.available; commit(); toast(`${d.name} is ${d.available ? 'available' : 'on break'}`) }
    else if(ds.next){
      const cur = inConsult(ds.next); if(cur) cur.status = 'done';
      const n = queueOf(ds.next)[0]; if(n){ n.status = 'in'; toast(`Calling ${n.token} · ${n.name}`) } commit();
    }
    else if(ds.done){ find(ds.done).status = 'done'; commit() }
    else if(ds.noshow){ const b = find(ds.noshow); b.status = 'noshow'; commit(); toast(`${b.token} marked no-show`) }
    else if(ds.up || ds.down){
      const b = find(ds.up || ds.down), ids = queueOf(b.doc).map(x => x.id), i = ids.indexOf(b.id), j = ds.up ? i-1 : i+1;
      [ids[i], ids[j]] = [ids[j], ids[i]]; reorder(b.doc, ids); commit();
    }
    else if(ds.prio){
      const b = find(ds.prio); b.priority = !b.priority;
      if(b.priority){ const ids = queueOf(b.doc).map(x => x.id).filter(x => x !== b.id); reorder(b.doc, [b.id, ...ids]); toast(`${b.token} moved to the front`) }
      commit();
    }
    else if(ds.cancel){ const b = find(ds.cancel); confirmBox(`Cancel ${b.token}?`, `${b.name}'s booking with ${docById(b.doc).name} will be cancelled.`, 'Cancel booking', () => { b.status = 'cancelled'; commit(); toast(`${b.token} cancelled`) }) }
  };
  let dragId = null;
  B.querySelectorAll('.qrow[draggable="true"]').forEach(row => {
    row.ondragstart = e => { dragId = row.dataset.id; row.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try{ e.dataTransfer.setData('text/plain', dragId) }catch(_){} };
    row.ondragend = () => { row.classList.remove('dragging'); B.querySelectorAll('.drop-before,.drop-after').forEach(r => r.classList.remove('drop-before','drop-after')) };
    row.ondragover = e => {
      if(!dragId || row.parentElement.dataset.doc !== S.bookings.find(b => b.id === dragId).doc) return;
      e.preventDefault(); const r = row.getBoundingClientRect(), before = e.clientY < r.top + r.height/2;
      row.classList.toggle('drop-before', before); row.classList.toggle('drop-after', !before);
    };
    row.ondragleave = () => row.classList.remove('drop-before','drop-after');
    row.ondrop = e => {
      e.preventDefault(); if(!dragId || dragId === row.dataset.id) return;
      const doc = row.parentElement.dataset.doc, before = row.classList.contains('drop-before');
      const ids = queueOf(doc).map(b => b.id).filter(id => id !== dragId);
      let at = ids.indexOf(row.dataset.id); if(!before) at++;
      ids.splice(at, 0, dragId); reorder(doc, ids); dragId = null; commit(); toast('Queue reordered');
    };
  });
}
function unreadFor(u, side){ return (S.chats[u] || []).filter(m => !m.read && m.from === (side === 'admin' ? 'user' : 'admin')).length }
function renderThreads(){
  const users = Object.keys(S.chats).sort((a,b) => (S.chats[b].at(-1)?.t || 0) - (S.chats[a].at(-1)?.t || 0));
  const total = users.reduce((s,u) => s + unreadFor(u,'admin'), 0);
  if(lastUnread >= 0 && total > lastUnread) toast('New patient message');
  lastUnread = total;
  const ub = $('#unreadAll'); ub.hidden = !total; ub.textContent = total;
  $('#threads').innerHTML = users.length ? users.map(u => {
    const name = S.chatNames[u] || S.users[u]?.name || u, last = S.chats[u].at(-1), n = unreadFor(u,'admin');
    return `<li><button class="thread" data-thread="${u}" aria-current="${activeThread===u}"><span class="avatar">${initials(name)}</span>
      <span style="min-width:0"><div class="t-name">${esc(name)}</div><div class="t-last">${last ? (last.from==='admin'?'You: ':'') + esc(last.text) : 'No messages'}</div></span>
      ${n ? `<span class="badge">${n}</span>` : ''}</button></li>`;
  }).join('') : `<li class="q-empty">No chats yet</li>`;
  $('#threads').onclick = e => { const t = e.target.closest('[data-thread]'); if(!t) return; activeThread = t.dataset.thread; markRead(activeThread,'admin'); commit(); $('#ainput').focus() };
}
function markRead(u, side){ (S.chats[u] || []).forEach(m => { if(m.from === (side==='admin'?'user':'admin')) m.read = true }) }
function renderMsgs(el, list, meSide){
  el.innerHTML = list.length ? list.map(m => `<div class="msg ${m.from===meSide?'me':'them'}">${esc(m.text)}<time>${fmtTime(m.t)}</time></div>`).join('')
    : `<div class="msgs-empty">No messages yet.</div>`;
  el.scrollTop = el.scrollHeight;
}
function renderThread(){
  const el = $('#amsgs'), on = !!activeThread && S.chats[activeThread];
  $('#ainput').disabled = !on; $('#asend').disabled = !on;
  $('#ainput').placeholder = on ? `Reply to ${S.chatNames[activeThread] || activeThread}` : 'Pick a chat to reply';
  if(!on){ el.innerHTML = `<div class="msgs-empty">Pick a patient on the left to read and reply.</div>`; return }
  if(unreadFor(activeThread,'admin')){ markRead(activeThread,'admin'); save() }
  renderMsgs(el, S.chats[activeThread], 'admin');
}

/* booking modal (admin add + patient reschedule) */
function bookingModal({admin=false, booking=null}){
  const b = booking;
  let dept = b ? b.dept : 'GM';
  openModal(`<h3>${b ? `Reschedule ${b.token}` : 'Add booking'}</h3>
    ${b ? '' : `<div class="field"><label for="mname">Patient name</label><input class="input" id="mname" placeholder="Full name"></div>`}
    <div class="field"><label for="mdept">Department</label><select class="select" id="mdept">${DEPTS.map(d => `<option value="${d.id}" ${d.id===dept?'selected':''}>${d.name}</option>`).join('')}</select></div>
    <div class="field"><label for="mdoc">Doctor</label><select class="select" id="mdoc"></select></div>
    <div class="field"><label for="mslot">Time slot</label><select class="select" id="mslot"></select></div>
    ${admin ? `<label class="check"><input type="checkbox" id="mprio"> Urgent: put at the front of the queue</label>` : ''}
    <div class="err" id="merr"></div>
    <div class="modal-actions"><button class="btn" data-x>Close</button><button class="btn btn-primary" data-ok>${b ? 'Save changes' : 'Add to queue'}</button></div>`,
  m => {
    const fillDocs = () => {
      const ds = S.doctors.filter(d => d.dept === $('#mdept',m).value);
      $('#mdoc',m).innerHTML = ds.map(d => `<option value="${d.id}" ${b && b.doc===d.id?'selected':''}>${d.name} · ${d.from}–${d.to}${d.available?'':' (on break)'}</option>`).join('');
      fillSlots();
    };
    const fillSlots = () => { const d = docById($('#mdoc',m).value); $('#mslot',m).innerHTML = slotsFor(d).map(s => `<option ${b && b.slot===s?'selected':''}>${s}</option>`).join('') };
    $('#mdept',m).onchange = fillDocs; $('#mdoc',m).onchange = fillSlots; fillDocs();
    $('[data-x]',m).onclick = closeModal;
    $('[data-ok]',m).onclick = () => {
      const deptV = $('#mdept',m).value, docV = $('#mdoc',m).value, slot = $('#mslot',m).value;
      if(b){
        const moved = b.doc !== docV;
        if(b.dept !== deptV) b.token = nextToken(deptV);
        b.dept = deptV; b.slot = slot;
        if(moved){ b.doc = docV; b.order = maxOrder()+1; b.startAhead = queueOf(docV).length - 1 }
        closeModal(); commit(); toast(`Booking updated · token ${b.token}`); return;
      }
      const name = $('#mname',m).value.trim(); if(!name) return $('#merr',m).textContent = 'Enter the patient name.';
      const nb = createBooking({name, dept:deptV, doc:docV, slot, priority: admin && $('#mprio',m).checked});
      closeModal(); commit(); toast(`Added ${nb.token} · ${name}`);
    };
  });
}

/* ================= PATIENT ================= */
let pMode = null, prevAhead = null, prevStatus = null, lastPUnread = -1, form = {dept:'GM', doc:null, slot:null};
function myActive(){ return S.bookings.find(b => b.user === session.user && b.date === todayStr() && (b.status === 'waiting' || b.status === 'in')) }
function renderPatient(){
  $('#app').innerHTML = topbar('Patient', session.name) + `
  <main class="page wrap">
    <div class="patient-grid">
      <section style="display:grid;gap:20px;min-width:0">
        <div id="pmain"></div>
        <div class="card"><div class="card-h"><h3>Your visits</h3></div><ul class="hist" id="hist"></ul></div>
      </section>
      <aside class="card chatcard">
        <div class="card-h"><span class="avatar">FD</span><div><h3>Front desk</h3><div class="hint">Usually replies in a few minutes</div></div></div>
        <div class="msgs" id="pmsgs"></div>
        <div class="quick" id="quick">
          ${["How long is the wait?","I'm running late","Can I change my doctor?"].map(q => `<button type="button">${q}</button>`).join('')}
        </div>
        <form class="composer" id="pform"><input class="input" id="pinput" placeholder="Message the front desk" autocomplete="off"><button class="btn btn-primary">Send</button></form>
      </aside>
    </div>
  </main>`;
  bindTop();
  const send = txt => {
    const u = session.user; S.chats[u] = S.chats[u] || []; S.chatNames[u] = session.name;
    S.chats[u].push({from:'user', text:txt, t:Date.now(), read:false}); commit();
  };
  $('#pform').onsubmit = e => { e.preventDefault(); const v = $('#pinput').value.trim(); if(!v) return; $('#pinput').value=''; send(v) };
  $('#quick').onclick = e => { const b = e.target.closest('button'); if(b) send(b.textContent) };
  pMode = null; prevAhead = null; prevStatus = null; lastPUnread = -1;
  refresh();
}
function renderPatientMain(){
  const b = myActive(), el = $('#pmain');
  if(!b){
    if(prevStatus === 'in' || prevStatus === 'waiting'){
      const last = S.bookings.filter(x => x.user === session.user).sort((x,y) => y.created - x.created)[0];
      if(last && last.status === 'done') toast('Visit completed. Thank you!');
      else if(last && (last.status === 'cancelled' || last.status === 'noshow')) toast(`Your booking ${last.token} was ${STATUS[last.status].toLowerCase()}`);
    }
    prevStatus = null; prevAhead = null;
    if(pMode !== 'form'){ pMode = 'form'; renderBookForm() } else updatePreview();
    return;
  }
  pMode = 'ticket';
  const d = docById(b.doc), ahead = aheadOf(b), cur = inConsult(b.doc), wait = waitMin(b);
  if(b.status === 'in' && prevStatus !== 'in'){ beep(); toast(`It's your turn! Go to Room ${d.room}.`) }
  else if(b.status === 'waiting' && ahead <= 1 && prevAhead !== null && prevAhead > 1){ beep(); toast("You're next. Please head to the waiting area.") }
  prevAhead = ahead; prevStatus = b.status;
  const total = Math.max(b.startAhead, ahead) + 1, pct = b.status === 'in' ? 100 : Math.round((1 - ahead/total) * 100);
  let alert = '';
  if(b.status === 'in') alert = `<div class="alert turn">● It's your turn. Please go to Room ${d.room}.</div>`;
  else if(!d.available) alert = `<div class="alert warn">${esc(d.name)} is on a short break. Your place in the queue is kept.</div>`;
  else if(ahead === 0) alert = `<div class="alert next">🔔 You're next. Please wait near Room ${d.room}.</div>`;
  else if(ahead === 1) alert = `<div class="alert next">🔔 Only 1 person ahead of you. Start heading to the clinic.</div>`;
  el.innerHTML = `<article class="card ticket">
    <div class="ticket-top">
      <div class="tokbox"><div class="label">Your token</div><div class="big">${b.token}</div></div>
      <div class="ticket-info">
        <div>${chip(b.status)} ${b.priority ? '<span class="prio">Urgent</span>' : ''}</div>
        <h2>${esc(d.name)}</h2>
        <span class="muted">${deptOf(b.dept).name} · Room ${d.room} · Slot <span class="mono">${b.slot}</span></span>
        <span class="muted">Booked for ${esc(b.name)}</span>
      </div>
    </div>
    <div class="facts">
      <div class="fact"><span class="label">People ahead</span><span class="v">${b.status==='in' ? 0 : ahead}</span></div>
      <div class="fact"><span class="label">Est. wait</span><span class="v">${b.status==='in' ? 'Now' : `${wait}<small style="font-size:14px;color:var(--muted)"> min</small>`}</span></div>
      <div class="fact"><span class="label">Now serving</span><span class="v mono">${cur ? cur.token : '—'}</span></div>
    </div>
    ${alert}
    <div class="progress">
      <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Queue progress"><i style="width:${Math.max(pct,4)}%"></i></div>
      <div class="bar-legend"><span>Booked</span><span>${pct}% of the way</span><span>Your turn</span></div>
    </div>
    <div class="ticket-actions">
      ${b.status === 'waiting' ? `<button class="btn" id="resBtn">Reschedule</button><button class="btn btn-danger" id="canBtn">Cancel booking</button>` : ''}
      <span class="hint" style="align-self:center">This page updates on its own as the queue moves.</span>
    </div>
  </article>`;
  $('#resBtn') && ($('#resBtn').onclick = () => bookingModal({booking:b}));
  $('#canBtn') && ($('#canBtn').onclick = () => confirmBox(`Cancel ${b.token}?`, 'You will lose your place in the queue.', 'Cancel booking', () => { b.status = 'cancelled'; prevStatus = null; commit(); toast('Booking cancelled') }));
}
function renderBookForm(){
  const docs = S.doctors.filter(d => d.dept === form.dept);
  if(!docs.find(d => d.id === form.doc)) form.doc = (docs.find(d => d.available) || docs[0]).id;
  const doc = docById(form.doc), sl = slotsFor(doc);
  if(!sl.includes(form.slot)) form.slot = sl[0];
  $('#pmain').innerHTML = `<article class="card book">
    <div><span class="label">New booking</span><h2 style="font-size:26px;margin-top:4px">Book a consultation</h2>
    <p class="muted" style="margin:4px 0 0">Pick a department and doctor. You get a token right away and can wait from anywhere.</p></div>
    <div class="book-grid">
      <div class="field"><label for="bname">Patient name</label><input class="input" id="bname" value="${esc(form.name ?? session.name)}"></div>
      <div class="field"><label for="bdept">Department</label><select class="select" id="bdept">${DEPTS.map(d => `<option value="${d.id}" ${d.id===form.dept?'selected':''}>${d.name}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label for="bdoc">Consult with</label><select class="select" id="bdoc">${docs.map(d => `<option value="${d.id}" ${d.id===form.doc?'selected':''}>${d.name} · Room ${d.room} · ${d.from}–${d.to}${d.available?'':' (on break)'}</option>`).join('')}</select></div>
    <div class="field"><label>Time slot</label><div class="slots" id="bslots">${sl.map(s => `<button type="button" class="slot" aria-pressed="${s===form.slot}" data-slot="${s}">${s}</button>`).join('')}</div></div>
    <div class="preview" id="bprev"></div>
    <div class="err" id="berr"></div>
    <div><button class="btn btn-primary" id="bookBtn" style="padding:12px 22px">Get my token</button></div>
  </article>`;
  updatePreview();
  $('#bname').oninput = e => form.name = e.target.value;
  $('#bdept').onchange = e => { form.dept = e.target.value; form.doc = null; renderBookForm() };
  $('#bdoc').onchange = e => { form.doc = e.target.value; renderBookForm() };
  $('#bslots').onclick = e => { const s = e.target.closest('[data-slot]'); if(!s) return; form.slot = s.dataset.slot; $('#bslots').querySelectorAll('.slot').forEach(x => x.setAttribute('aria-pressed', x === s)) };
  $('#bookBtn').onclick = () => {
    const name = $('#bname').value.trim(); if(!name) return $('#berr').textContent = 'Enter the patient name.';
    const b = createBooking({name, dept:form.dept, doc:form.doc, slot:form.slot, user:session.user});
    form.name = undefined; prevStatus = 'waiting'; prevAhead = aheadOf(b); commit(); toast(`Booked! Your token is ${b.token}`);
  };
}
function updatePreview(){
  const p = $('#bprev'); if(!p) return; const d = docById(form.doc), n = queueOf(d.id).length, cur = inConsult(d.id);
  p.innerHTML = `${d.available ? '<span class="chip st-done">Available</span>' : '<span class="chip st-break">On break</span>'}
    <span><b>${n}</b> waiting for ${esc(d.name)} · about <b>${n*AVG + (cur?5:0)} min</b> wait${cur ? ` · now serving <span class="mono">${cur.token}</span>` : ''}</span>`;
}
function renderHistory(){
  const list = S.bookings.filter(b => b.user === session.user && !(b.date === todayStr() && (b.status === 'waiting' || b.status === 'in')))
                         .sort((a,b) => b.date.localeCompare(a.date) || b.created - a.created);
  $('#hist').innerHTML = list.length ? list.map(b => `<li><span class="mono" style="font-weight:700">${b.token}</span>
      <span style="min-width:0"><b style="font-weight:600">${esc(docById(b.doc).name)}</b><br><span class="hint">${deptOf(b.dept).name} · ${new Date(b.date).toLocaleDateString([], {day:'numeric', month:'short', year:'numeric'})} · ${b.slot}</span></span>
      ${chip(b.status)}</li>`).join('') : `<li class="q-empty" style="display:block;border:0">Past visits will show here.</li>`;
}
function renderPChat(){
  const u = session.user, list = S.chats[u] || [], n = unreadFor(u,'user');
  if(lastPUnread >= 0 && n > lastPUnread) toast('New reply from the front desk');
  if(n){ markRead(u,'user'); save() }
  lastPUnread = 0;
  renderMsgs($('#pmsgs'), list, 'user');
  if(!list.length) $('#pmsgs').innerHTML = `<div class="msgs-empty">Questions about your visit? Message the front desk here.</div>`;
}

if(session && session.role === 'patient' && !S.users[session.user]) session = null;
